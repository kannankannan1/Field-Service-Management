server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: keystone-fieldservice
  datasource:
    url: ${DB_URL:jdbc:h2:mem:keystone;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # HS256 secret, min 32 bytes. Override via JWT_SECRET in production.
    secret: ${JWT_SECRET:keystone-dev-secret-change-me-in-production-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:5173,http://localhost:3000}
  sla:
    urgent-hours: ${SLA_URGENT_HOURS:4}
    high-hours: ${SLA_HIGH_HOURS:24}
    medium-hours: ${SLA_MEDIUM_HOURS:72}
    low-hours: ${SLA_LOW_HOURS:120}
  breach-check-ms: ${SLA_BREACH_CHECK_MS:60000}
  initial-delay-ms: ${SLA_INITIAL_DELAY_MS:10000}
  scheduler:
    enabled: ${SLA_SCHEDULER_ENABLED:true}

logging:
  level:
    root: INFO
    com.keystone.fieldservice: INFO
